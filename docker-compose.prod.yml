name: struct-pass-reference
services:
  caddy:
    image: caddy:2-alpine
    container_name: struct-pass-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      # rete site のドメイン（cmn-0403・共有 Caddy が rete を TLS 終端する）。rete を同居させる時に
      # .env.production へ実ドメインを設定する。既定値は「構文上有効だが実在しない」placeholder＝
      # 未設定（reference 単体運用）でも {$RETE_DOMAIN} site block が空キーにならず caddy が正常起動する
      # （空文字だと parse error で caddy が crash loop し既存 site ごと全断する・caddy validate 実測）。
      RETE_DOMAIN: ${RETE_DOMAIN:-http://rete-unset.invalid}
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - struct-pass-network
      - edge
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  postgres:
    image: postgres:16-alpine
    container_name: struct-pass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-structpass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-struct_pass_prod}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - struct-pass-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-structpass}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      platforms:
        - linux/arm64
    container_name: struct-pass-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      # 接続プール上限は必須（本番は未指定だと起動拒否＝validateDatabasePoolLimits・ref-0071）。
      DATABASE_URL: postgresql://${POSTGRES_USER:-structpass}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-struct_pass_prod}?schema=public&connection_limit=5&pool_timeout=70
      CORS_ORIGIN: https://${DOMAIN}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      # SSO 一本化で必須化した OIDC 5 変数（rev-quality 2026-07-31 SEC-M2: 欠落で backend が起動不能だった）。
      # main.ts の validateEnv() が起動時に検査し、不足時は fail-fast する。
      OIDC_ISSUER: ${OIDC_ISSUER:?OIDC_ISSUER is required}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?OIDC_CLIENT_ID is required}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET is required}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?OIDC_REDIRECT_URI is required}
      OIDC_FRONTEND_URL: ${OIDC_FRONTEND_URL:?OIDC_FRONTEND_URL is required}
      # ref-0086: 本番の初期管理者 bootstrap（SYS_ADMIN・status=ACTIVE）用。SUB 未設定時は bootstrap は skip
      # （開発・既存本番のデプロイを壊さない）。SUB = rete Account.id = reference User.oidcSub。
      BOOTSTRAP_ADMIN_SUB: ${BOOTSTRAP_ADMIN_SUB:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      # Caddy 1 段配下なので trust proxy hops=1 を有効化（レート制限を実クライアント IP 単位にする・ref-0062）
      TRUST_PROXY: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      struct-pass-network: {}
      # 共有Caddyからは固有名で到達させる。Rete側の service 名 backend との衝突を避ける。
      edge:
        aliases:
          - reference-backend
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3001/api/v1/health',
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      platforms:
        - linux/arm64
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
        DOCKER_BUILD: '1'
        # rete リンク（global-nav）の焼き込み値（ref-0087）。NEXT_PUBLIC_* はビルド時に
        # インライン化されるため実行時 environment では直せない＝build args が唯一の注入点。
        # 未設定は :? で即失敗させる（コード側フォールバック localhost:3010 の黙った焼き込み防止）。
        # NEXT_PUBLIC_RETE_API_URL は d1264/d1265 で表示個人設定の写しを廃止したため不要。
        NEXT_PUBLIC_RETE_URL: ${NEXT_PUBLIC_RETE_URL:?NEXT_PUBLIC_RETE_URL is required (rete link; no localhost fallback in prod)}
        # 見た目のみの 2 変数（未設定でもビルドは通る）。APP_ENV は空なら env バッジ非表示。
        # APP_SUBTITLE は空文字がコード側既定（?? 判定）を素通しで潰すため、compose 側で既定を補う。
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-}
        NEXT_PUBLIC_APP_SUBTITLE: ${NEXT_PUBLIC_APP_SUBTITLE:-商品管理システム}
    container_name: struct-pass-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      struct-pass-network: {}
      # 共有Caddyからは固有名で到達させる。Rete側の service 名 frontend との衝突を避ける。
      edge:
        aliases:
          - reference-frontend
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  struct-pass-network:
    driver: bridge
  # rete と共有する network。両アプリの deploy script が不足時に `edge` を作成し、
  # compose project の所有権を片側に固定せず相乗りする。
  edge:
    external: true

volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
