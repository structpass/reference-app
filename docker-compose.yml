services:
  postgres:
    image: postgres:16-alpine
    container_name: struct-pass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # 既定値を持たせない（未設定なら compose が起動前に停止する）。開発用の値は root の .env に明示する。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (dev - set it in .env)}
      POSTGRES_DB: ${POSTGRES_DB:-struct_pass_dev}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    ports:
      # ホストの開発サーバー（pnpm dev・packages/backend/.env の DATABASE_URL）からだけ届けばよい。
      # '5432:5432' は全インターフェースを開き、同じ LAN の第三者へ DB を晒すため使わない。
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - struct-pass-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: struct-pass-backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      # 接続プール上限は必須（NODE_ENV=production のため未指定だと起動拒否・ref-0071）。
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (dev - set it in .env)}@postgres:5432/${POSTGRES_DB:-struct_pass_dev}?schema=public&connection_limit=5&pool_timeout=70
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - struct-pass-network
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3001/api/v1/health',
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
        # Dockerfile が RETE 2 変数を必須化した（未設定はビルド失敗・ref-0087）ため、dev は
        # localhost を明示して渡す（黙ったフォールバックでなく宣言された dev 値）。
        NEXT_PUBLIC_RETE_URL: http://localhost:3010
        NEXT_PUBLIC_RETE_API_URL: http://localhost:3011/api/v1
    container_name: struct-pass-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - struct-pass-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

networks:
  struct-pass-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
